name: PGarage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-check:
    name: Python backend check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api_python/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r api_python/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q api_python/app

  frontend-build:
    name: Vue frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend_vue/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend_vue
        run: npm ci
      - name: Build frontend
        working-directory: frontend_vue
        run: npm run build
