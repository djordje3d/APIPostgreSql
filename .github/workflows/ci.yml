name: PGarage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-check:
    name: Python backend check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:test_password@localhost:5432/garaza_test
      USE_API_FEE_CALCULATION: "true"
      USE_API_PAYMENT_STATUS: "true"
      API_KEY: ""
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: garaza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d garaza_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api_python/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r api_python/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q api_python/app
      - name: Create test database tables
        run: |
          python -c "from api_python.app.db import Base, engine; from api_python.app import models; Base.metadata.create_all(bind=engine)"
      - name: Run backend tests
        run: python -m pytest api_python/tests -v --tb=short

  frontend-build:
    name: Vue frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend_vue/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend_vue
        run: npm ci
      - name: Build frontend
        working-directory: frontend_vue
        run: npm run build
